name: probe
on:
  page_build:
  watch:
    types: [started]
  fork:
  issues:
  discussion:
  push:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: echo "CTX EVENT=${{ github.event_name }} ACTOR=${{ github.actor }} REF=${{ github.ref }}"
      - uses: actions/checkout@v4
      - name: default checkout tree
        run: echo "TREEMARKER=$(cat WHICHBRANCH.txt 2>/dev/null || echo NONE)"
      - name: can this run reach ATTACKER bytes on gh-pages?
        continue-on-error: true
        run: |
          git fetch origin gh-pages --depth=1 2>&1 | tail -2
          echo "ATTACKERFILE=$(git show origin/gh-pages:attacker-payload.txt 2>/dev/null || echo UNREACHABLE)"
      - name: event payload keys
        run: |
          cat <<'EOF' > /tmp/ev.json
          ${{ toJSON(github.event) }}
          EOF
          echo "EVENTKEYS=$(python3 -c "import json;print(sorted(json.load(open('/tmp/ev.json')).keys()))")"
          echo "EVENTSNIP=$(head -c 600 /tmp/ev.json | tr '\n' ' ')"
      - run: mkdir -p cd && echo "content-from-${{ github.event_name }}-run-${{ github.run_id }}" > cd/m.txt
      - name: SAVE event-scoped key
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: cd
          key: evt2-${{ github.event_name }}-${{ github.run_id }}
